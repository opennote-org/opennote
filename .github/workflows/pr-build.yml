name: Build PR packages

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            toolchain: 1.98.1
            command: sh ./scripts/build_release_mac.sh
            artifact: target/release/opennote-macos.dmg
          - platform: windows-x86_64
            os: windows-latest
            toolchain: 1.96.0
            command: ./scripts/build_release_windows.ps1
            artifact: target/opennote-windows-x86_64.zip
          - platform: linux-x86_64
            os: ubuntu-latest
            toolchain: 1.96.0
            command: bash ./scripts/build_release_linux.sh
            artifact: target/release/opennote-linux-x86_64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxkbcommon-x11-dev \
            patchelf

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up uv
        if: runner.os == 'macOS'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Build and package
        run: ${{ matrix.command }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: opennote-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
